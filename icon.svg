<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle border highlight -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGlow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Apple Logo -->
  <g fill="url(#appleGrad)">
    <!-- Leaf -->
    <path d="M296.8 108.6c11.2-13.8 18.8-33 16.7-52.6-16.1 0.7-35.7 10.8-47.2 24.3-10.2 11.8-19.1 30.8-16.7 49.8 18 1.4 36.3-8 47.2-21.5z"/>
    <!-- Body -->
    <path d="M312.6 206.2c0.6-38.8 31.7-57.5 33.1-58.4-18-26.3-46-29.9-55.9-30.3-23.7-2.4-46.3 14-58.3 14-12 0-30.8-13.6-50.6-13.3-26 0.4-50 15.1-63.4 38.4-27 46.9-6.9 116.3 19.4 154.2 12.9 18.5 28.2 39.3 48.3 38.5 19.3-0.8 26.6-12.4 49.9-12.4 23.3 0 29.9 12.4 50.2 12 20.7-0.4 33.8-18.9 46.4-37.4 14.6-21.4 20.6-42.1 21-43.2-0.5-0.2-40.3-15.5-40.1-62.1z"/>
  </g>

  <!-- Mini Service Badge Indicator -->
  <g transform="translate(320, 320)">
    <circle cx="36" cy="36" r="34" fill="#0071e3" stroke="#1c1c1e" stroke-width="4"/>
    <!-- Wrench / Check icon -->
    <path d="M28 36 L34 42 L46 28" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

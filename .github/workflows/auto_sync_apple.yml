name: Auto Sync Official Apple Data

on:
  schedule:
    # 每天北京时间中午 11:00 (UTC 03:00) 自动执行
    - cron: '0 3 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面一键手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Apple Official Data Syncer
        run: |
          python sync_apple_official.py

      - name: Commit and push if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js estimator_catalog.json official_apple_pricing.json apple_service_portable.html
          if git diff --staged --quiet; then
            echo "No changes detected from Apple official API."
          else
            git commit -m "chore(auto-sync): 自动同步 Apple 官网最新维修报价与网点数据 [skip ci]"
            git push
          fi
